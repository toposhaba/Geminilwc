<template>
    <lightning-card title="On-Device Vision OCR" icon-name="utility:image">
        <div class="slds-var-p-horizontal_medium slds-var-p-bottom_medium">
            <div
                class="slds-box slds-box_x-small slds-var-m-bottom_small slds-theme_shade"
            >
                <lightning-icon
                    icon-name="utility:info"
                    size="x-small"
                    class="slds-var-m-right_x-small"
                ></lightning-icon>
                <span class="slds-text-body_small">{statusLabel}</span>
            </div>

            <template lwc:if={isModelLoading}>
                <lightning-progress-bar
                    value={downloadPercent}
                    size="large"
                    class="slds-var-m-bottom_small"
                ></lightning-progress-bar>
            </template>

            <template lwc:if={usesRunner}>
                <c-local-llm-runner
                    onprogress={handleRunnerProgress}
                    onchunk={handleRunnerChunk}
                    onstatus={handleRunnerStatus}
                ></c-local-llm-runner>
            </template>

            <div class="slds-grid slds-gutters slds-wrap">
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-combobox
                        label="Engine"
                        value={engine}
                        options={engineOptions}
                        onchange={handleEngineChange}
                        disabled={isProcessing}
                    ></lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2">
                    <lightning-combobox
                        label="Output format"
                        value={formatType}
                        options={formatOptions}
                        onchange={handleFormatChange}
                        disabled={isProcessing}
                    ></lightning-combobox>
                </div>
            </div>

            <template lwc:if={isCustomFormat}>
                <lightning-textarea
                    label="Custom prompt"
                    value={customPrompt}
                    onchange={handleCustomPromptChange}
                    disabled={isProcessing}
                    class="slds-var-m-top_x-small"
                ></lightning-textarea>
            </template>
            <template lwc:else>
                <lightning-combobox
                    label="Language"
                    value={language}
                    options={languageOptions}
                    onchange={handleLanguageChange}
                    disabled={isProcessing}
                    class="slds-var-m-top_x-small"
                ></lightning-combobox>
            </template>

            <lightning-combobox
                name="preprocessMode"
                label="Image preprocessing"
                value={preprocessMode}
                options={preprocessOptions}
                onchange={handlePreprocessChange}
                disabled={isProcessing}
                field-level-help="Binarizing (black/white threshold) only helps scanned documents. Auto detects whether each image looks like a document and decides for you."
                class="slds-var-m-top_x-small"
            ></lightning-combobox>
            <template lwc:if={autoDetectNote}>
                <p class="slds-text-body_small slds-text-color_weak slds-var-m-top_xx-small">
                    {autoDetectNote}
                </p>
            </template>

            <div class="slds-var-m-top_small">
                <label class="slds-form-element__label" for="ocr-file-input">
                    Images
                </label>
                <input
                    id="ocr-file-input"
                    type="file"
                    accept="image/png,image/jpeg,image/webp"
                    multiple
                    onchange={handleFileChange}
                    disabled={isProcessing}
                    class="slds-var-m-bottom_x-small"
                />
                <template lwc:if={hasImage}>
                    <template lwc:if={isBatch}>
                        <p
                            class="slds-text-body_small slds-var-m-bottom_x-small"
                        >
                            {fileCountLabel}
                        </p>
                    </template>
                    <div class="ocr-preview">
                        <img src={imagePreviewUrl} alt="Selected document" />
                    </div>
                </template>
            </div>

            <template lwc:if={errorMessage}>
                <div
                    class="slds-text-color_error slds-var-m-top_x-small"
                    role="alert"
                >
                    {errorMessage}
                </div>
            </template>

            <div class="slds-var-m-top_small slds-grid slds-grid_align-spread">
                <div>
                    <template lwc:if={hasResults}>
                        <lightning-button
                            label="Copy result"
                            onclick={handleCopy}
                        ></lightning-button>
                    </template>
                </div>
                <div>
                    <template lwc:if={isProcessing}>
                        <lightning-button
                            variant="destructive"
                            label="Stop"
                            onclick={handleStop}
                            class="slds-var-m-right_x-small"
                        ></lightning-button>
                    </template>
                    <lightning-button
                        variant="brand"
                        label="Extract text"
                        onclick={handleRun}
                        disabled={runDisabled}
                    ></lightning-button>
                </div>
            </div>

            <template lwc:if={showStatistics}>
                <p class="slds-text-body_small slds-var-m-top_small">
                    {statistics}
                </p>
            </template>

            <template lwc:if={hasResults}>
                <template for:each={fileResults} for:item="entry">
                    <div
                        key={entry.name}
                        class="ocr-result slds-var-m-top_small"
                    >
                        <template lwc:if={isBatch}>
                            <p class="ocr-result__name slds-text-title_caps">
                                {entry.name}
                            </p>
                        </template>
                        <template lwc:if={entry.error}>
                            <p class="slds-text-color_error">{entry.error}</p>
                        </template>
                        <template lwc:else>
                            <pre>{entry.text}</pre>
                        </template>
                    </div>
                </template>
            </template>
        </div>
    </lightning-card>
</template>
